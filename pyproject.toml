[project]
name = "agentiq"
version = "0.1.0"
description = "Evidence-based data analysis framework"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
web = ["streamlit>=1.40.0", "openpyxl>=3.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
